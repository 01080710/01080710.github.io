name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the site into dist/PCResume/ (base /PCResume, see astro.config.mjs).
      # The root only redirects to /PCResume/; there are no other routes.
      - name: Build
        run: |
          npm run build
          cat > dist/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Redirecting…</title>
          <meta http-equiv="refresh" content="0; url=/PCResume/">
          <link rel="canonical" href="/PCResume/">
          <a href="/PCResume/">/PCResume/</a>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
